<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Outstanding List</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#687386;--line:#e5e9f0;--primary:#2563eb;--green:#15803d;--yellow:#b45309;--red:#b91c1c}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
header{background:#172033;color:#fff;padding:18px 24px;position:sticky;top:0;z-index:10}
.brand{font-size:22px;font-weight:700;margin-bottom:14px}
nav{display:flex;gap:8px;flex-wrap:wrap}
nav button{border:0;background:#2b3850;color:#fff;padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:600}
nav button.active,nav button:hover{background:var(--primary)}
main{max-width:1250px;margin:24px auto;padding:0 18px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-bottom:18px}
.toolbar-left{display:flex;gap:10px;flex-wrap:wrap}
input,select,textarea{font:inherit;border:1px solid #d5dbe5;border-radius:8px;padding:9px 11px;background:#fff}
input[type=search]{min-width:260px}.btn{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:700}
.primary{background:var(--primary);color:#fff}.secondary{background:#e9edf4;color:#172033}
.section{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:22px;overflow:hidden}
.section-title{padding:15px 18px;font-size:17px;font-weight:700;border-bottom:1px solid var(--line)}
.section-title.running{color:var(--yellow)} .section-title.done{color:var(--green)}
table{width:100%;border-collapse:collapse} th,td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top} th{font-size:12px;text-transform:uppercase;color:var(--muted);background:#fafbfc}
tr:last-child td{border-bottom:0}.task-name{font-weight:600;white-space:pre-wrap}.muted{color:var(--muted);font-size:13px}
.badge{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700}
.belum{background:#f1f3f6;color:#475569}.proses{background:#fff3cd;color:var(--yellow)}.selesai{background:#dcfce7;color:var(--green)}
.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{border:0;background:#eef2f7;padding:7px 9px;border-radius:7px;cursor:pointer}
.empty{padding:24px;text-align:center;color:var(--muted)}
dialog{border:0;border-radius:14px;padding:0;width:min(620px,92vw);box-shadow:0 20px 70px #0003}dialog::backdrop{background:#0007}
.modal{padding:22px}.modal h2{margin:0 0 18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%}.field textarea{min-height:100px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.statusbar{margin-bottom:15px;color:var(--muted);font-size:13px}.error{color:var(--red);font-weight:700}
@media(max-width:700px){.form-grid{grid-template-columns:1fr}.full{grid-column:auto}th:nth-child(4),td:nth-child(4){display:none}input[type=search]{min-width:0;width:100%}}
</style>
</head>
<body>
<header>
  <div class="brand">OUTSTANDING LIST</div>
  <nav id="nav"></nav>
</header>

<main>
  <div class="toolbar">
    <div class="toolbar-left">
      <input id="search" type="search" placeholder="🔍 Cari task..." oninput="render()">
      <select id="sort" onchange="render()">
        <option value="deadline">Deadline terdekat</option>
        <option value="newest">Terbaru</option>
        <option value="oldest">Terlama</option>
      </select>
    </div>
    <button class="btn primary" onclick="openAdd()">+ Tambah Task</button>
  </div>
  <div id="statusbar" class="statusbar">Menghubungkan ke database...</div>
  <div id="app"></div>
</main>

<dialog id="taskDialog">
  <div class="modal">
    <h2 id="modalTitle">Tambah Task</h2>
    <form id="taskForm" onsubmit="saveTask(event)">
      <input type="hidden" id="taskId">
      <div class="form-grid">
        <div class="field">
          <label>PIC</label>
          <select id="pic" required></select>
        </div>
        <div class="field">
          <label>Status</label>
          <select id="taskStatus" required>
            <option value="Belum">Belum</option>
            <option value="Proses">Proses</option>
            <option value="Selesai">Selesai</option>
          </select>
        </div>
        <div class="field full">
          <label>Task</label>
          <textarea id="task" required placeholder="Tulis task..."></textarea>
        </div>
        <div class="field">
          <label>Deadline</label>
          <input id="deadline" type="date">
        </div>
        <div class="field">
          <label>Keterangan</label>
          <input id="note" type="text" placeholder="Opsional">
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn secondary" onclick="taskDialog.close()">Batal</button>
        <button type="submit" class="btn primary">Simpan</button>
      </div>
    </form>
  </div>
</dialog>

<script>
/*
  ==========================================================
  SUPABASE CONFIG
  GANTI 2 NILAI DI BAWAH:
  1. SUPABASE_URL
  2. SUPABASE_PUBLISHABLE_KEY
  ==========================================================
*/
const SUPABASE_URL = "https://zwgstnuevycnyzgcggxy.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_W1-empf5i4JK4T4v7DNwmA_BV9RXUs7";

const PICS = ["Andry","David","Ferdy","Justin","Henry","Suwandi","Vincent","Hedona"];
let supabaseClient = null;
let tasks = [];
let selectedPIC = "ALL";

function configured(){
  return !SUPABASE_URL.includes("PASTE_") && !SUPABASE_PUBLISHABLE_KEY.includes("PASTE_");
}
function init(){
  if(configured()){
    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    loadTasks();
  }else{
    renderNav();
    document.getElementById("statusbar").innerHTML =
      '<span class="error">Belum terhubung ke Supabase.</span> Buka file ini dan isi SUPABASE_URL + SUPABASE_PUBLISHABLE_KEY.';
    render();
  }
}
function renderNav(){
  const items=["ALL",...PICS];
  document.getElementById("nav").innerHTML=items.map(p =>
    `<button class="${selectedPIC===p?'active':''}" onclick="selectPIC('${p}')">${p==="ALL"?"All":p}</button>`
  ).join("");
}
function selectPIC(pic){selectedPIC=pic;renderNav();render();}
function filtered(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  let list=tasks.filter(t => selectedPIC==="ALL" || t.pic===selectedPIC);
  if(q) list=list.filter(t => [t.pic,t.task,t.note,t.status].join(" ").toLowerCase().includes(q));
  const sort=document.getElementById("sort").value;
  list.sort((a,b)=>{
    if(sort==="newest") return new Date(b.created_at)-new Date(a.created_at);
    if(sort==="oldest") return new Date(a.created_at)-new Date(b.created_at);
    const ad=a.deadline||"9999-12-31", bd=b.deadline||"9999-12-31";
    return ad.localeCompare(bd);
  });
  return list;
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function formatDate(v){if(!v)return "-";const [y,m,d]=v.split("-");return `${d}/${m}/${y}`;}
function badge(s){return `<span class="badge ${s==="Selesai"?"selesai":s==="Proses"?"proses":"belum"}">${esc(s)}</span>`;}
function render(){
  const list=filtered();
  const running=list.filter(t=>t.status!=="Selesai");
  const done=list.filter(t=>t.status==="Selesai");
  document.getElementById("app").innerHTML = section("MASIH BERJALAN",running,false) + section("SELESAI",done,true);
}
function section(title,list,isDone){
  let html=`<section class="section"><div class="section-title ${isDone?"done":"running"}">${title} <span class="muted">(${list.length})</span></div>`;
  if(!list.length) return html+'<div class="empty">Tidak ada task di bagian ini.</div></section>';
  html+=`<table><thead><tr>${selectedPIC==="ALL"?"<th>PIC</th>":""}<th>Task</th><th>Deadline</th><th>Status</th><th>Keterangan</th><th>Aksi</th></tr></thead><tbody>`;
  html+=list.map(t=>`<tr>
    ${selectedPIC==="ALL"?`<td><b>${esc(t.pic)}</b></td>`:""}
    <td><div class="task-name">${esc(t.task)}</div></td>
    <td>${formatDate(t.deadline)}</td>
    <td>${badge(t.status)}</td>
    <td class="muted">${esc(t.note||"-")}</td>
    <td><div class="actions">
      <button onclick="openEdit('${t.id}')">Edit</button>
      <button onclick="quickStatus('${t.id}','${t.status==="Selesai"?"Proses":"Selesai"}')">${t.status==="Selesai"?"Buka":"Selesai"}</button>
      <button onclick="deleteTask('${t.id}')">Hapus</button>
    </div></td>
  </tr>`).join("");
  return html+"</tbody></table></section>";
}
async function loadTasks(){
  const {data,error}=await supabaseClient.from("tasks").select("*").order("deadline",{ascending:true,nullsFirst:false});
  if(error){
    document.getElementById("statusbar").innerHTML='<span class="error">Gagal membaca database:</span> '+esc(error.message);
    return;
  }
  tasks=data||[];
  document.getElementById("statusbar").textContent=`Terhubung ke Supabase • ${tasks.length} task`;
  render();
}
function openAdd(){
  document.getElementById("modalTitle").textContent="Tambah Task";
  document.getElementById("taskId").value="";
  document.getElementById("taskForm").reset();
  document.getElementById("pic").value=selectedPIC!=="ALL"?selectedPIC:PICS[0];
  document.getElementById("taskStatus").value="Belum";
  taskDialog.showModal();
}
function openEdit(id){
  const t=tasks.find(x=>String(x.id)===String(id)); if(!t)return;
  document.getElementById("modalTitle").textContent="Edit Task";
  document.getElementById("taskId").value=t.id;
  document.getElementById("pic").value=t.pic;
  document.getElementById("task").value=t.task;
  document.getElementById("taskStatus").value=t.status;
  document.getElementById("deadline").value=t.deadline||"";
  document.getElementById("note").value=t.note||"";
  taskDialog.showModal();
}
async function saveTask(e){
  e.preventDefault();
  const id=document.getElementById("taskId").value;
  const payload={
    pic:document.getElementById("pic").value,
    task:document.getElementById("task").value.trim(),
    status:document.getElementById("taskStatus").value,
    deadline:document.getElementById("deadline").value||null,
    note:document.getElementById("note").value.trim()||null
  };
  let result;
  if(id) result=await supabaseClient.from("tasks").update(payload).eq("id",id);
  else result=await supabaseClient.from("tasks").insert(payload);
  if(result.error){alert("Gagal menyimpan: "+result.error.message);return;}
  taskDialog.close(); await loadTasks();
}
async function quickStatus(id,status){
  const {error}=await supabaseClient.from("tasks").update({status}).eq("id",id);
  if(error){alert("Gagal mengubah status: "+error.message);return;}
  await loadTasks();
}
async function deleteTask(id){
  const t=tasks.find(x=>String(x.id)===String(id));
  if(!confirm(`Hapus task "${t?.task||""}"?`))return;
  const {error}=await supabaseClient.from("tasks").delete().eq("id",id);
  if(error){alert("Gagal menghapus: "+error.message);return;}
  await loadTasks();
}
document.getElementById("pic").innerHTML=PICS.map(p=>`<option>${p}</option>`).join("");
init();
</script>
</body>
</html>
