<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Outstanding List</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
    --bg:#f5f7fb;
    --card:#ffffff;
    --text:#172033;
    --muted:#687386;
    --line:#b8b8b8;
    --primary:#2563eb;
    --green:#15803d;
    --yellow:#b45309;
    --red:#b91c1c;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
}

/* =========================
   HEADER
========================= */

header{
    background:#172033;
    color:#fff;
    padding:15px 20px;
    position:sticky;
    top:0;
    z-index:100;
}

.brand{
    font-size:22px;
    font-weight:700;
    margin-bottom:12px;
}

nav{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    align-items:center;
}

nav button{
    border:0;
    background:#2b3850;
    color:#fff;
    padding:8px 13px;
    border-radius:7px;
    cursor:pointer;
    font-weight:600;
}

nav button:hover{
    background:#3d4d6c;
}

nav button.active{
    background:var(--primary);
}

nav button.add-person{
    background:#15803d;
}

nav button.manage-person{
    background:#475569;
}

/* =========================
   MAIN
========================= */

main{
    width:100%;
    margin:0 auto;
    padding:18px;
}

/* =========================
   TOOLBAR
========================= */

.toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}

.toolbar-left{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

input,
select,
textarea{
    font:inherit;
    border:1px solid #cbd5e1;
    border-radius:7px;
    padding:9px 11px;
    background:#fff;
}

input[type=search]{
    min-width:280px;
}

.btn{
    border:0;
    border-radius:7px;
    padding:10px 14px;
    cursor:pointer;
    font-weight:700;
}

.primary{
    background:var(--primary);
    color:#fff;
}

.secondary{
    background:#e9edf4;
    color:#172033;
}

.success{
    background:#15803d;
    color:#fff;
}

.danger{
    background:#dc2626;
    color:#fff;
}

/* =========================
   STATUS BAR
========================= */

.statusbar{
    margin-bottom:12px;
    color:var(--muted);
    font-size:13px;
}

.error{
    color:var(--red);
    font-weight:700;
}

/* =========================
   OVERALL TABLE
========================= */

.overall-wrapper{
    width:100%;
    overflow-x:auto;
    background:#fff;
    border:1px solid #999;
}

.overall-title{
    text-align:center;
    font-size:18px;
    font-weight:700;
    padding:9px;
    border-bottom:1px solid #999;
    background:#fff;
}

.overall-table{
    width:100%;
    min-width:900px;
    border-collapse:collapse;
    table-layout:fixed;
}

.overall-table th{
    border:1px solid #888;
    padding:8px 6px;
    text-align:center;
    font-size:14px;
    font-weight:700;
    background:#dbeafe;
}

.overall-table td{
    border:1px solid #999;
    padding:0;
    vertical-align:top;
    background:#fff;
}

.person-column{
    min-width:150px;
}

/* warna header orang bergantian */
.overall-table th:nth-child(1){background:#c8d9f3}
.overall-table th:nth-child(2){background:#ddd7eb}
.overall-table th:nth-child(3){background:#55dddd}
.overall-table th:nth-child(4){background:#f4e4d7}
.overall-table th:nth-child(5){background:#dfead5}
.overall-table th:nth-child(6){background:#c7dfbd}
.overall-table th:nth-child(7){background:#e5edcf}
.overall-table th:nth-child(8){background:#b8cbea}

.task-cell{
    min-height:72px;
    padding:9px 7px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    gap:5px;
    background:#b7d7a8;
}

.task-cell.done-cell{
    background:#d8ead1;
}

.task-text{
    font-size:13px;
    line-height:1.35;
    white-space:pre-wrap;
    word-break:break-word;
}

.task-deadline{
    font-size:11px;
    color:#475569;
}

.empty-cell{
    min-height:72px;
    background:#fff;
}

/* aksi task */
.task-actions{
    display:flex;
    gap:3px;
    justify-content:center;
    flex-wrap:wrap;
}

.task-actions button{
    border:0;
    padding:3px 6px;
    border-radius:4px;
    font-size:10px;
    cursor:pointer;
    background:#ffffffaa;
}

.task-actions button:hover{
    background:#fff;
}

/* =========================
   SECTION
========================= */

.section{
    background:var(--card);
    border:1px solid var(--line);
    margin-bottom:20px;
    overflow:hidden;
}

.section-title{
    padding:12px 15px;
    font-size:16px;
    font-weight:700;
    border-bottom:1px solid var(--line);
}

.section-title.running{
    color:var(--yellow);
}

.section-title.done{
    color:var(--green);
}

.muted{
    color:var(--muted);
    font-size:13px;
}

.empty{
    padding:25px;
    text-align:center;
    color:var(--muted);
}

/* =========================
   PERSON VIEW
========================= */

.person-view{
    background:#fff;
    border:1px solid var(--line);
    overflow:hidden;
}

.person-title{
    padding:14px 16px;
    font-size:18px;
    font-weight:700;
    border-bottom:1px solid var(--line);
}

.person-table{
    width:100%;
    border-collapse:collapse;
}

.person-table th,
.person-table td{
    padding:10px 12px;
    border-bottom:1px solid var(--line);
    text-align:left;
    vertical-align:top;
}

.person-table th{
    font-size:12px;
    color:var(--muted);
    background:#f8fafc;
    text-transform:uppercase;
}

.person-table tr:last-child td{
    border-bottom:0;
}

.task-name{
    font-weight:600;
    white-space:pre-wrap;
}

.badge{
    display:inline-block;
    border-radius:999px;
    padding:5px 9px;
    font-size:12px;
    font-weight:700;
}

.belum{
    background:#f1f3f6;
    color:#475569;
}

.proses{
    background:#fff3cd;
    color:var(--yellow);
}

.selesai{
    background:#dcfce7;
    color:var(--green);
}

.actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

.actions button{
    border:0;
    background:#eef2f7;
    padding:6px 9px;
    border-radius:6px;
    cursor:pointer;
}

.actions button:hover{
    background:#dce3ed;
}

/* =========================
   DIALOG
========================= */

dialog{
    border:0;
    border-radius:14px;
    padding:0;
    width:min(620px,92vw);
    box-shadow:0 20px 70px #0005;
}

dialog::backdrop{
    background:#0007;
}

.modal{
    padding:22px;
}

.modal h2{
    margin:0 0 18px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:13px;
}

.full{
    grid-column:1/-1;
}

.field label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin-bottom:6px;
}

.field input,
.field select,
.field textarea{
    width:100%;
}

.field textarea{
    min-height:100px;
    resize:vertical;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:18px;
}

/* =========================
   PEOPLE MANAGER
========================= */

.people-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    max-height:400px;
    overflow-y:auto;
}

.people-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border:1px solid #e2e8f0;
    border-radius:8px;
    padding:10px 12px;
}

.people-item-name{
    font-weight:700;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    main{
        padding:10px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    input[type=search]{
        min-width:0;
        width:100%;
    }

    .toolbar-left{
        width:100%;
    }

    .toolbar-left select{
        width:100%;
    }

    .toolbar .primary{
        width:100%;
    }

    .overall-table{
        min-width:900px;
    }
}
</style>
</head>

<body>

<header>

    <div class="brand">
        OUTSTANDING LIST
    </div>

    <nav id="nav"></nav>

</header>


<main>

    <!-- TOOLBAR -->
    <div class="toolbar">

        <div class="toolbar-left">

            <input
                id="search"
                type="search"
                placeholder="🔍 Cari task..."
                oninput="render()"
            >

            <select id="sort" onchange="render()">

                <option value="deadline">
                    Deadline terdekat
                </option>

                <option value="newest">
                    Task terbaru
                </option>

                <option value="oldest">
                    Task terlama
                </option>

            </select>

        </div>


        <button
            class="btn primary"
            onclick="openAdd()"
        >
            + Tambah Task
        </button>

    </div>


    <div
        id="statusbar"
        class="statusbar"
    >
        Menghubungkan ke database...
    </div>


    <!-- APP -->
    <div id="app"></div>

</main>


<!-- =====================================================
     MODAL TASK
===================================================== -->

<dialog id="taskDialog">

    <div class="modal">

        <h2 id="modalTitle">
            Tambah Task
        </h2>

        <form
            id="taskForm"
            onsubmit="saveTask(event)"
        >

            <input
                type="hidden"
                id="taskId"
            >

            <div class="form-grid">


                <!-- PIC -->

                <div class="field">

                    <label>
                        PIC
                    </label>

                    <select
                        id="pic"
                        required
                    ></select>

                </div>


                <!-- STATUS -->

                <div class="field">

                    <label>
                        Status
                    </label>

                    <select
                        id="taskStatus"
                        required
                    >

                        <option value="Belum">
                            Belum
                        </option>

                        <option value="Proses">
                            Proses
                        </option>

                        <option value="Selesai">
                            Selesai
                        </option>

                    </select>

                </div>


                <!-- TASK -->

                <div class="field full">

                    <label>
                        Task
                    </label>

                    <textarea
                        id="task"
                        required
                        placeholder="Tulis task..."
                    ></textarea>

                </div>


                <!-- DEADLINE -->

                <div class="field">

                    <label>
                        Deadline
                    </label>

                    <input
                        id="deadline"
                        type="date"
                    >

                </div>


                <!-- KETERANGAN -->

                <div class="field">

                    <label>
                        Keterangan
                    </label>

                    <input
                        id="note"
                        type="text"
                        placeholder="Opsional"
                    >

                </div>

            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    class="btn secondary"
                    onclick="closeTaskDialog()"
                >
                    Batal
                </button>

                <button
                    type="submit"
                    class="btn primary"
                >
                    Simpan
                </button>

            </div>

        </form>

    </div>

</dialog>


<!-- =====================================================
     MODAL TAMBAH ORANG
===================================================== -->

<dialog id="personDialog">

    <div class="modal">

        <h2>
            Tambah Orang
        </h2>

        <form onsubmit="addPerson(event)">

            <div class="field">

                <label>
                    Nama
                </label>

                <input
                    id="personName"
                    type="text"
                    required
                    placeholder="Contoh: Andi"
                    autocomplete="off"
                >

            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    class="btn secondary"
                    onclick="closePersonDialog()"
                >
                    Batal
                </button>

                <button
                    type="submit"
                    class="btn success"
                >
                    Tambah
                </button>

            </div>

        </form>

    </div>

</dialog>


<!-- =====================================================
     MODAL KELOLA ORANG
===================================================== -->

<dialog id="peopleManagerDialog">

    <div class="modal">

        <h2>
            Kelola Orang
        </h2>

        <div
            id="peopleList"
            class="people-list"
        ></div>


        <div class="modal-actions">

            <button
                type="button"
                class="btn secondary"
                onclick="closePeopleManager()"
            >
                Tutup
            </button>

        </div>

    </div>

</dialog>


<script>

/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
    "https://zwgstnuevycnyzgcggxy.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_W1-empf5i4JK4T4v7DNwmA_BV9RXUs7";


/* =========================================================
   SUPABASE
========================================================= */

let supabaseClient = null;


/* =========================================================
   DATA
========================================================= */

let people = [];

let tasks = [];

let selectedPIC = "ALL";


/* =========================================================
   INIT
========================================================= */

async function init(){

    if(
        !SUPABASE_URL ||
        !SUPABASE_PUBLISHABLE_KEY
    ){

        document.getElementById("statusbar").innerHTML =
            '<span class="error">Supabase belum dikonfigurasi.</span>';

        return;
    }


    supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    await loadPeople();

    await loadTasks();

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function esc(value){

    return String(value ?? "")
        .replace(/[&<>"']/g, function(m){

            return {
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"
            }[m];

        });

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(value){

    if(!value){
        return "-";
    }

    const parts = value.split("-");

    if(parts.length !== 3){
        return value;
    }

    return `${parts[2]}/${parts[1]}/${parts[0]}`;

}


/* =========================================================
   LOAD PEOPLE
========================================================= */

async function loadPeople(){

    const {
        data,
        error
    } = await supabaseClient
        .from("people")
        .select("*")
        .order("name",{ascending:true});


    if(error){

        document.getElementById("statusbar").innerHTML =
            '<span class="error">Gagal membaca data orang:</span> '
            + esc(error.message);

        return;
    }


    people = data || [];


    renderNav();

    fillPICSelect();

}


/* =========================================================
   LOAD TASKS
========================================================= */

async function loadTasks(){

    const {
        data,
        error
    } = await supabaseClient
        .from("tasks")
        .select("*")
        .order(
            "deadline",
            {
                ascending:true,
                nullsFirst:false
            }
        );


    if(error){

        document.getElementById("statusbar").innerHTML =
            '<span class="error">Gagal membaca task:</span> '
            + esc(error.message);

        return;
    }


    tasks = data || [];


    document.getElementById("statusbar").textContent =
        `Terhubung ke Supabase • ${tasks.length} task • ${people.length} orang`;


    render();

}


/* =========================================================
   NAVBAR
========================================================= */

function renderNav(){

    const nav =
        document.getElementById("nav");


    let html = "";


    /* OVERALL */

    html += `
        <button
            class="${selectedPIC === "ALL" ? "active" : ""}"
            onclick="selectPIC('ALL')"
        >
            Overall
        </button>
    `;


    /* ORANG */

    people.forEach(person => {

        const name = person.name;

        html += `
            <button
                class="${selectedPIC === name ? "active" : ""}"
                onclick="selectPIC(${JSON.stringify(name)})"
            >
                ${esc(name)}
            </button>
        `;

    });


    /* TAMBAH ORANG */

    html += `
        <button
            class="add-person"
            onclick="openPersonDialog()"
        >
            + Orang
        </button>
    `;


    /* KELOLA */

    html += `
        <button
            class="manage-person"
            onclick="openPeopleManager()"
        >
            ⚙ Kelola
        </button>
    `;


    nav.innerHTML = html;

}


/* =========================================================
   SELECT PIC
========================================================= */

function selectPIC(pic){

    selectedPIC = pic;

    renderNav();

    render();

}


/* =========================================================
   FILTER
========================================================= */

function filteredTasks(){

    const searchInput =
        document.getElementById("search");


    const query =
        searchInput
            ? searchInput.value.trim().toLowerCase()
            : "";


    let list = tasks.filter(task => {

        if(
            selectedPIC !== "ALL" &&
            task.pic !== selectedPIC
        ){
            return false;
        }

        return true;

    });


    if(query){

        list = list.filter(task => {

            return [
                task.pic,
                task.task,
                task.note,
                task.status,
                task.deadline
            ]
            .join(" ")
            .toLowerCase()
            .includes(query);

        });

    }


    const sort =
        document.getElementById("sort")?.value
        || "deadline";


    list.sort((a,b) => {

        if(sort === "newest"){

            return new Date(b.created_at)
                - new Date(a.created_at);

        }


        if(sort === "oldest"){

            return new Date(a.created_at)
                - new Date(b.created_at);

        }


        const ad =
            a.deadline || "9999-12-31";

        const bd =
            b.deadline || "9999-12-31";


        return ad.localeCompare(bd);

    });


    return list;

}


/* =========================================================
   RENDER UTAMA
========================================================= */

function render(){

    const app =
        document.getElementById("app");


    if(selectedPIC === "ALL"){

        app.innerHTML =
            renderOverall();

    }else{

        app.innerHTML =
            renderPersonView(selectedPIC);

    }

}


/* =========================================================
   RENDER OVERALL
========================================================= */

function renderOverall(){

    const list =
        filteredTasks();


    const outstanding =
        list.filter(
            task => task.status !== "Selesai"
        );


    const completed =
        list.filter(
            task => task.status === "Selesai"
        );


    return `

        ${renderOverallTable(
            "OUTSTANDING LIST",
            outstanding,
            false
        )}

        <div style="height:20px"></div>

        ${renderOverallTable(
            "SELESAI",
            completed,
            true
        )}

    `;

}


/* =========================================================
   RENDER TABEL OVERALL
========================================================= */

function renderOverallTable(
    title,
    list,
    isDone
){

    if(!people.length){

        return `

            <section class="section">

                <div class="section-title">
                    ${title}
                </div>

                <div class="empty">
                    Belum ada orang.
                    Klik <b>+ Orang</b> untuk menambahkan.
                </div>

            </section>

        `;

    }


    /* =====================================================
       BUAT DATA PER ORANG
    ===================================================== */

    const grouped = {};


    people.forEach(person => {

        grouped[person.name] = [];

    });


    list.forEach(task => {

        if(!grouped[task.pic]){

            grouped[task.pic] = [];

        }

        grouped[task.pic].push(task);

    });


    /* =====================================================
       CARI JUMLAH BARIS TERBANYAK
    ===================================================== */

    let maxRows = 0;


    people.forEach(person => {

        const count =
            grouped[person.name]?.length || 0;


        if(count > maxRows){

            maxRows = count;

        }

    });


    /* minimal satu baris */

    if(maxRows === 0){

        maxRows = 1;

    }


    /* =====================================================
       HEADER
    ===================================================== */

    let html = `

        <section>

            <div class="overall-wrapper">

                <div class="overall-title">
                    ${title}
                </div>

                <table class="overall-table">

                    <thead>

                        <tr>
    `;


    people.forEach(person => {

        html += `

            <th class="person-column">
                ${esc(person.name)}
            </th>

        `;

    });


    html += `

                        </tr>

                    </thead>

                    <tbody>
    `;


    /* =====================================================
       BARIS
    ===================================================== */

    for(let row = 0; row < maxRows; row++){

        html += "<tr>";


        people.forEach(person => {

            const personTasks =
                grouped[person.name] || [];


            const task =
                personTasks[row];


            if(task){

                html += `

                    <td>

                        <div
                            class="task-cell
                            ${isDone ? "done-cell" : ""}"
                        >

                            <div class="task-text">
                                ${esc(task.task)}
                            </div>

                            ${
                                task.deadline
                                ?
                                `
                                <div class="task-deadline">
                                    Deadline:
                                    ${formatDate(task.deadline)}
                                </div>
                                `
                                :
                                ""
                            }


                            <div class="task-actions">

                                <button
                                    onclick="openEdit('${task.id}')"
                                >
                                    Edit
                                </button>


                                ${
                                    task.status === "Selesai"

                                    ?

                                    `
                                    <button
                                        onclick="quickStatus('${task.id}','Proses')"
                                    >
                                        Buka
                                    </button>
                                    `

                                    :

                                    `
                                    <button
                                        onclick="quickStatus('${task.id}','Selesai')"
                                    >
                                        ✓
                                    </button>
                                    `
                                }


                                <button
                                    onclick="deleteTask('${task.id}')"
                                >
                                    ×
                                </button>

                            </div>

                        </div>

                    </td>

                `;

            }else{

                html += `

                    <td>

                        <div
                            class="empty-cell"
                        ></div>

                    </td>

                `;

            }

        });


        html += "</tr>";

    }


    html += `

                    </tbody>

                </table>

            </div>

        </section>

    `;


    return html;

}


/* =========================================================
   PERSON VIEW
========================================================= */

function renderPersonView(name){

    const list =
        filteredTasks().filter(
            task => task.pic === name
        );


    const running =
        list.filter(
            task => task.status !== "Selesai"
        );


    const done =
        list.filter(
            task => task.status === "Selesai"
        );


    return `

        <section class="person-view">

            <div class="person-title">

                ${esc(name)}

                <span class="muted">
                    • ${list.length} task
                </span>

            </div>


            ${renderPersonSection(
                "MASIH BERJALAN",
                running
            )}


            ${renderPersonSection(
                "SELESAI",
                done,
                true
            )}

        </section>

    `;

}


/* =========================================================
   PERSON SECTION
========================================================= */

function renderPersonSection(
    title,
    list,
    isDone = false
){

    let html = `

        <div class="section-title ${isDone ? "done" : "running"}">

            ${title}

            <span class="muted">
                (${list.length})
            </span>

        </div>

    `;


    if(!list.length){

        html += `

            <div class="empty">
                Tidak ada task.
            </div>

        `;

        return html;

    }


    html += `

        <table class="person-table">

            <thead>

                <tr>

                    <th>Task</th>
                    <th>Deadline</th>
                    <th>Status</th>
                    <th>Keterangan</th>
                    <th>Aksi</th>

                </tr>

            </thead>

            <tbody>

    `;


    html += list.map(task => {

        return `

            <tr>

                <td>

                    <div class="task-name">

                        ${esc(task.task)}

                    </div>

                </td>


                <td>

                    ${formatDate(task.deadline)}

                </td>


                <td>

                    ${statusBadge(task.status)}

                </td>


                <td class="muted">

                    ${esc(task.note || "-")}

                </td>


                <td>

                    <div class="actions">

                        <button
                            onclick="openEdit('${task.id}')"
                        >
                            Edit
                        </button>


                        ${
                            task.status === "Selesai"

                            ?

                            `
                            <button
                                onclick="quickStatus('${task.id}','Proses')"
                            >
                                Buka
                            </button>
                            `

                            :

                            `
                            <button
                                onclick="quickStatus('${task.id}','Selesai')"
                            >
                                Selesai
                            </button>
                            `
                        }


                        <button
                            onclick="deleteTask('${task.id}')"
                        >
                            Hapus
                        </button>

                    </div>

                </td>

            </tr>

        `;

    }).join("");


    html += `

            </tbody>

        </table>

    `;


    return html;

}


/* =========================================================
   STATUS BADGE
========================================================= */

function statusBadge(status){

    let className = "belum";


    if(status === "Proses"){

        className = "proses";

    }


    if(status === "Selesai"){

        className = "selesai";

    }


    return `

        <span class="badge ${className}">

            ${esc(status)}

        </span>

    `;

}


/* =========================================================
   FILL PIC SELECT
========================================================= */

function fillPICSelect(){

    const select =
        document.getElementById("pic");


    if(!select){
        return;
    }


    select.innerHTML =
        people.map(person => `

            <option value="${esc(person.name)}">

                ${esc(person.name)}

            </option>

        `).join("");

}


/* =========================================================
   TAMBAH TASK
========================================================= */

function openAdd(){

    document.getElementById(
        "modalTitle"
    ).textContent = "Tambah Task";


    document.getElementById(
        "taskId"
    ).value = "";


    document.getElementById(
        "taskForm"
    ).reset();


    fillPICSelect();


    const picSelect =
        document.getElementById("pic");


    if(
        selectedPIC !== "ALL" &&
        people.some(
            person => person.name === selectedPIC
        )
    ){

        picSelect.value =
            selectedPIC;

    }


    document.getElementById(
        "taskStatus"
    ).value = "Belum";


    document.getElementById(
        "taskDialog"
    ).showModal();

}


/* =========================================================
   EDIT TASK
========================================================= */

function openEdit(id){

    const task =
        tasks.find(
            item => String(item.id) === String(id)
        );


    if(!task){
        return;
    }


    document.getElementById(
        "modalTitle"
    ).textContent = "Edit Task";


    document.getElementById(
        "taskId"
    ).value = task.id;


    fillPICSelect();


    document.getElementById(
        "pic"
    ).value = task.pic;


    document.getElementById(
        "task"
    ).value = task.task;


    document.getElementById(
        "taskStatus"
    ).value = task.status;


    document.getElementById(
        "deadline"
    ).value = task.deadline || "";


    document.getElementById(
        "note"
    ).value = task.note || "";


    document.getElementById(
        "taskDialog"
    ).showModal();

}


/* =========================================================
   SAVE TASK
========================================================= */

async function saveTask(event){

    event.preventDefault();


    if(!supabaseClient){

        alert("Supabase belum terhubung.");

        return;

    }


    const id =
        document.getElementById(
            "taskId"
        ).value;


    const payload = {

        pic:
            document.getElementById(
                "pic"
            ).value,

        task:
            document.getElementById(
                "task"
            ).value.trim(),

        status:
            document.getElementById(
                "taskStatus"
            ).value,

        deadline:
            document.getElementById(
                "deadline"
            ).value || null,

        note:
            document.getElementById(
                "note"
            ).value.trim() || null

    };


    let result;


    if(id){

        result =
            await supabaseClient
                .from("tasks")
                .update(payload)
                .eq("id",id);

    }else{

        result =
            await supabaseClient
                .from("tasks")
                .insert(payload);

    }


    if(result.error){

        alert(
            "Gagal menyimpan task:\n\n"
            + result.error.message
        );

        return;

    }


    closeTaskDialog();


    await loadTasks();

}


/* =========================================================
   QUICK STATUS
========================================================= */

async function quickStatus(
    id,
    status
){

    if(!supabaseClient){
        return;
    }


    const {
        error
    } =
        await supabaseClient
            .from("tasks")
            .update({
                status:status
            })
            .eq("id",id);


    if(error){

        alert(
            "Gagal mengubah status:\n\n"
            + error.message
        );

        return;

    }


    await loadTasks();

}


/* =========================================================
   DELETE TASK
========================================================= */

async function deleteTask(id){

    const task =
        tasks.find(
            item => String(item.id) === String(id)
        );


    if(!task){
        return;
    }


    const confirmed =
        confirm(
            `Hapus task berikut?\n\n${task.task}`
        );


    if(!confirmed){
        return;
    }


    const {
        error
    } =
        await supabaseClient
            .from("tasks")
            .delete()
            .eq("id",id);


    if(error){

        alert(
            "Gagal menghapus task:\n\n"
            + error.message
        );

        return;

    }


    await loadTasks();

}


/* =========================================================
   TAMBAH ORANG
========================================================= */

function openPersonDialog(){

    document.getElementById(
        "personName"
    ).value = "";


    document.getElementById(
        "personDialog"
    ).showModal();


    setTimeout(() => {

        document.getElementById(
            "personName"
        ).focus();

    },100);

}


function closePersonDialog(){

    document.getElementById(
        "personDialog"
    ).close();

}


/* =========================================================
   SAVE PERSON
========================================================= */

async function addPerson(event){

    event.preventDefault();


    const input =
        document.getElementById(
            "personName"
        );


    const name =
        input.value.trim();


    if(!name){
        return;
    }


    /* cek nama lokal */

    const exists =
        people.some(
            person =>
                person.name.toLowerCase()
                === name.toLowerCase()
        );


    if(exists){

        alert(
            "Nama tersebut sudah ada."
        );

        return;

    }


    const {
        error
    } =
        await supabaseClient
            .from("people")
            .insert({
                name:name
            });


    if(error){

        alert(
            "Gagal menambahkan orang:\n\n"
            + error.message
        );

        return;

    }


    closePersonDialog();


    await loadPeople();


    selectedPIC = name;


    renderNav();

    render();


    document.getElementById(
        "statusbar"
    ).textContent =
        `Terhubung ke Supabase • ${tasks.length} task • ${people.length} orang`;

}


/* =========================================================
   PEOPLE MANAGER
========================================================= */

function openPeopleManager(){

    renderPeopleManager();


    document.getElementById(
        "peopleManagerDialog"
    ).showModal();

}


function closePeopleManager(){

    document.getElementById(
        "peopleManagerDialog"
    ).close();

}


/* =========================================================
   RENDER PEOPLE MANAGER
========================================================= */

function renderPeopleManager(){

    const container =
        document.getElementById(
            "peopleList"
        );


    if(!people.length){

        container.innerHTML = `

            <div class="empty">

                Belum ada orang.

            </div>

        `;

        return;

    }


    container.innerHTML =
        people.map(person => {

            const taskCount =
                tasks.filter(
                    task =>
                        task.pic === person.name
                ).length;


            return `

                <div class="people-item">

                    <div>

                        <div class="people-item-name">

                            ${esc(person.name)}

                        </div>

                        <div class="muted">

                            ${taskCount} task

                        </div>

                    </div>


                    <button
                        class="btn danger"
                        onclick="deletePerson('${person.id}')"
                    >
                        Hapus
                    </button>

                </div>

            `;

        }).join("");

}


/* =========================================================
   DELETE PERSON
========================================================= */

async function deletePerson(id){

    const person =
        people.find(
            item => String(item.id) === String(id)
        );


    if(!person){
        return;
    }


    /* cek task */

    const taskCount =
        tasks.filter(
            task =>
                task.pic === person.name
        ).length;


    if(taskCount > 0){

        alert(
            `Tidak bisa menghapus ${person.name}.\n\n`
            +
            `Masih ada ${taskCount} task yang menggunakan PIC tersebut.\n\n`
            +
            `Selesaikan atau pindahkan task terlebih dahulu.`
        );

        return;

    }


    const confirmed =
        confirm(
            `Hapus orang "${person.name}"?`
        );


    if(!confirmed){
        return;
    }


    const {
        error
    } =
        await supabaseClient
            .from("people")
            .delete()
            .eq("id",id);


    if(error){

        alert(
            "Gagal menghapus orang:\n\n"
            + error.message
        );

        return;

    }


    if(selectedPIC === person.name){

        selectedPIC = "ALL";

    }


    await loadPeople();

    renderPeopleManager();

    render();

}


/* =========================================================
   CLOSE TASK DIALOG
========================================================= */

function closeTaskDialog(){

    document.getElementById(
        "taskDialog"
    ).close();

}


/* =========================================================
   START
========================================================= */

init();

</script>

</html>
