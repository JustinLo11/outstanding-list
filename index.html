<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Outstanding List</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

/* =========================================================
   GLOBAL
========================================================= */

:root{

    --bg:#f4f6f8;
    --card:#ffffff;

    --text:#1f2937;
    --muted:#6b7280;

    --line:#e5e7eb;

    --primary:#2563eb;
    --primary-soft:#eff6ff;

    --green:#15803d;
    --green-soft:#dcfce7;

    --yellow:#b45309;
    --yellow-soft:#fff7ed;

    --red:#dc2626;
    --red-soft:#fef2f2;

    --shadow:0 3px 12px rgba(15,23,42,.06);

}


*{
    box-sizing:border-box;
}


body{

    margin:0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:var(--bg);

    color:var(--text);

}


/* =========================================================
   HEADER
========================================================= */

header{

    background:#172033;

    color:#fff;

    padding:16px 22px;

    position:sticky;

    top:0;

    z-index:100;

    box-shadow:
        0 2px 12px rgba(0,0,0,.12);

}


.brand{

    font-size:21px;

    font-weight:700;

    margin-bottom:13px;

    letter-spacing:.2px;

}


nav{

    display:flex;

    gap:7px;

    flex-wrap:wrap;

    align-items:center;

}


nav button{

    border:0;

    background:#2b3850;

    color:#fff;

    padding:8px 13px;

    border-radius:8px;

    cursor:pointer;

    font-weight:600;

    transition:.15s;

}


nav button:hover{

    background:#3b4a65;

    transform:translateY(-1px);

}


nav button.active{

    background:var(--primary);

}


nav button.add-person{

    background:#15803d;

}


nav button.manage-person{

    background:#475569;

}


/* =========================================================
   MAIN
========================================================= */

main{

    width:100%;

    padding:20px;

}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:10px;

    flex-wrap:wrap;

    margin-bottom:13px;

}


.toolbar-left{

    display:flex;

    gap:9px;

    flex-wrap:wrap;

}


input,
select,
textarea{

    font:inherit;

    border:1px solid #d5dbe3;

    border-radius:8px;

    padding:9px 11px;

    background:#fff;

    color:var(--text);

    outline:none;

}


input:focus,
select:focus,
textarea:focus{

    border-color:#93c5fd;

    box-shadow:
        0 0 0 3px rgba(37,99,235,.08);

}


input[type=search]{

    min-width:280px;

}


.btn{

    border:0;

    border-radius:8px;

    padding:10px 14px;

    cursor:pointer;

    font-weight:700;

    transition:.15s;

}


.btn:hover{

    transform:translateY(-1px);

}


.primary{

    background:var(--primary);

    color:#fff;

}


.secondary{

    background:#eef2f7;

    color:var(--text);

}


.success{

    background:var(--green);

    color:#fff;

}


.danger{

    background:var(--red);

    color:#fff;

}


/* =========================================================
   STATUS BAR
========================================================= */

.statusbar{

    margin-bottom:14px;

    color:var(--muted);

    font-size:13px;

}


.error{

    color:var(--red);

    font-weight:700;

}


/* =========================================================
   OVERALL WRAPPER
========================================================= */

.overall-section{

    margin-bottom:24px;

}


.overall-heading{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:10px;

}


.overall-heading-title{

    font-size:17px;

    font-weight:700;

    color:var(--text);

}


.overall-heading-title.running{

    color:#475569;

}


.overall-heading-title.done{

    color:var(--green);

}


.overall-count{

    color:var(--muted);

    font-size:13px;

    font-weight:600;

}


/* =========================================================
   OVERALL TABLE CONTAINER
========================================================= */

.overall-wrapper{

    width:100%;

    overflow-x:auto;

    background:#fff;

    border:1px solid #e1e5ea;

    border-radius:12px;

    box-shadow:var(--shadow);

}


/* =========================================================
   OVERALL TABLE
========================================================= */

.overall-table{

    width:100%;

    min-width:900px;

    border-collapse:separate;

    border-spacing:0;

    table-layout:fixed;

}


/* =========================================================
   PERSON HEADER
========================================================= */

.overall-table th{

    position:sticky;

    top:0;

    z-index:5;

    padding:11px 9px;

    text-align:center;

    font-size:13px;

    font-weight:700;

    color:#334155;

    background:#f8fafc;

    border-bottom:1px solid #e2e8f0;

}


/*
   Header nama bisa diklik
*/

.person-header-button{

    width:100%;

    border:0;

    background:transparent;

    color:#334155;

    font:inherit;

    font-weight:700;

    cursor:pointer;

    padding:5px 4px;

    border-radius:6px;

    transition:.15s;

}


.person-header-button:hover{

    background:#e2e8f0;

    color:var(--primary);

}


/* =========================================================
   TABLE BODY
========================================================= */

.overall-table td{

    padding:7px;

    vertical-align:top;

    border-bottom:1px solid #f0f2f5;

}


.overall-table tr:last-child td{

    border-bottom:0;

}


/* garis vertikal sangat lembut */

.overall-table td + td,
.overall-table th + th{

    border-left:1px solid #f1f3f5;

}


/* =========================================================
   TASK CARD
========================================================= */

.task-cell{

    min-height:82px;

    padding:11px 10px;

    border-radius:9px;

    background:#f8fafc;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    gap:6px;

    transition:.15s;

}


.task-cell:hover{

    box-shadow:
        0 2px 8px rgba(15,23,42,.08);

    transform:translateY(-1px);

}


/*
   HANYA SELESAI YANG HIJAU
*/

.task-cell.done-cell{

    background:var(--green-soft);

}


/* task belum */

.task-cell.belum-cell{

    background:#f8fafc;

}


/* task proses */

.task-cell.proses-cell{

    background:#fffaf0;

}


.task-text{

    font-size:13px;

    line-height:1.4;

    white-space:pre-wrap;

    word-break:break-word;

}


.task-deadline{

    font-size:11px;

    color:#64748b;

}


.task-status-small{

    font-size:10px;

    font-weight:700;

    padding:3px 7px;

    border-radius:999px;

}


.task-status-small.proses{

    background:#ffedd5;

    color:#9a3412;

}


.task-status-small.selesai{

    background:#bbf7d0;

    color:#166534;

}


/* =========================================================
   TASK ACTION
========================================================= */

.task-actions{

    display:flex;

    justify-content:center;

    gap:4px;

    flex-wrap:wrap;

}


.task-actions button{

    border:1px solid #dbe1e8;

    background:#fff;

    color:#475569;

    padding:4px 7px;

    border-radius:5px;

    font-size:10px;

    cursor:pointer;

    transition:.15s;

}


.task-actions button:hover{

    background:#f1f5f9;

    color:#111827;

}


/* tombol selesai */

.task-actions button.finish-btn{

    color:var(--green);

}


.task-actions button.finish-btn:hover{

    background:var(--green-soft);

}


/* =========================================================
   EMPTY CELL
========================================================= */

.empty-cell{

    min-height:82px;

}


/* =========================================================
   PERSON VIEW
========================================================= */

.person-view{

    background:#fff;

    border:1px solid #e1e5ea;

    border-radius:12px;

    overflow:hidden;

    box-shadow:var(--shadow);

}


.person-title{

    padding:16px 18px;

    font-size:18px;

    font-weight:700;

    border-bottom:1px solid var(--line);

}


.person-section-title{

    padding:13px 16px;

    font-size:15px;

    font-weight:700;

    border-bottom:1px solid var(--line);

}


.person-section-title.running{

    color:#475569;

}


.person-section-title.done{

    color:var(--green);

}


.person-table{

    width:100%;

    border-collapse:collapse;

}


.person-table th,
.person-table td{

    padding:11px 13px;

    border-bottom:1px solid var(--line);

    text-align:left;

    vertical-align:top;

}


.person-table th{

    font-size:11px;

    color:var(--muted);

    background:#fafbfc;

    text-transform:uppercase;

}


.person-table tr:last-child td{

    border-bottom:0;

}


.task-name{

    font-weight:600;

    white-space:pre-wrap;

}


.muted{

    color:var(--muted);

    font-size:13px;

}


/* =========================================================
   BADGE
========================================================= */

.badge{

    display:inline-block;

    border-radius:999px;

    padding:5px 9px;

    font-size:12px;

    font-weight:700;

}


.badge.belum{

    background:#f1f5f9;

    color:#475569;

}


.badge.proses{

    background:#fff3cd;

    color:#a16207;

}


.badge.selesai{

    background:var(--green-soft);

    color:var(--green);

}


/* =========================================================
   ACTIONS PERSON VIEW
========================================================= */

.actions{

    display:flex;

    gap:5px;

    flex-wrap:wrap;

}


.actions button{

    border:0;

    background:#eef2f7;

    color:#334155;

    padding:6px 9px;

    border-radius:6px;

    cursor:pointer;

}


.actions button:hover{

    background:#dfe5ed;

}


/* =========================================================
   EMPTY
========================================================= */

.empty{

    padding:28px;

    text-align:center;

    color:var(--muted);

}


/* =========================================================
   DIALOG
========================================================= */

dialog{

    border:0;

    border-radius:14px;

    padding:0;

    width:min(620px,92vw);

    box-shadow:
        0 20px 70px rgba(0,0,0,.28);

}


dialog::backdrop{

    background:rgba(0,0,0,.55);

}


.modal{

    padding:22px;

}


.modal h2{

    margin:0 0 18px;

}


.form-grid{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:13px;

}


.full{

    grid-column:1/-1;

}


.field label{

    display:block;

    font-size:13px;

    font-weight:700;

    margin-bottom:6px;

}


.field input,
.field select,
.field textarea{

    width:100%;

}


.field textarea{

    min-height:100px;

    resize:vertical;

}


.modal-actions{

    display:flex;

    justify-content:flex-end;

    gap:8px;

    margin-top:18px;

}


/* =========================================================
   PEOPLE MANAGER
========================================================= */

.people-list{

    display:flex;

    flex-direction:column;

    gap:8px;

    max-height:400px;

    overflow-y:auto;

}


.people-item{

    display:flex;

    justify-content:space-between;

    align-items:center;

    border:1px solid #e2e8f0;

    border-radius:8px;

    padding:10px 12px;

}


.people-item-name{

    font-weight:700;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    main{

        padding:10px;

    }


    .form-grid{

        grid-template-columns:1fr;

    }


    .full{

        grid-column:auto;

    }


    input[type=search]{

        min-width:0;

        width:100%;

    }


    .toolbar-left{

        width:100%;

    }


    .toolbar-left select{

        width:100%;

    }


    .toolbar .primary{

        width:100%;

    }


    .overall-table{

        min-width:900px;

    }

}

</style>

</head>


<body>


<!-- =======================================================
     HEADER
======================================================= -->

<header>

    <div class="brand">
        OUTSTANDING LIST
    </div>


    <nav id="nav"></nav>

</header>


<!-- =======================================================
     MAIN
======================================================= -->

<main>


    <!-- TOOLBAR -->

    <div class="toolbar">

        <div class="toolbar-left">

            <input
                id="search"
                type="search"
                placeholder="🔍 Cari task..."
                oninput="render()"
            >


            <select
                id="sort"
                onchange="render()"
            >

                <option value="deadline">
                    Deadline terdekat
                </option>

                <option value="newest">
                    Task terbaru
                </option>

                <option value="oldest">
                    Task terlama
                </option>

            </select>

        </div>


        <button
            class="btn primary"
            onclick="openAdd()"
        >
            + Tambah Task
        </button>

    </div>


    <div
        id="statusbar"
        class="statusbar"
    >
        Menghubungkan ke database...
    </div>


    <div id="app"></div>

</main>


<!-- =======================================================
     MODAL TASK
======================================================= -->

<dialog id="taskDialog">

    <div class="modal">

        <h2 id="modalTitle">
            Tambah Task
        </h2>


        <form
            id="taskForm"
            onsubmit="saveTask(event)"
        >

            <input
                type="hidden"
                id="taskId"
            >


            <div class="form-grid">


                <!-- PIC -->

                <div class="field">

                    <label>
                        PIC
                    </label>

                    <select
                        id="pic"
                        required
                    ></select>

                </div>


                <!-- STATUS -->

                <div class="field">

                    <label>
                        Status
                    </label>

                    <select
                        id="taskStatus"
                        required
                    >

                        <option value="Belum">
                            Belum
                        </option>

                        <option value="Proses">
                            Proses
                        </option>

                        <option value="Selesai">
                            Selesai
                        </option>

                    </select>

                </div>


                <!-- TASK -->

                <div class="field full">

                    <label>
                        Task
                    </label>

                    <textarea
                        id="task"
                        required
                        placeholder="Tulis task..."
                    ></textarea>

                </div>


                <!-- DEADLINE -->

                <div class="field">

                    <label>
                        Deadline
                    </label>

                    <input
                        id="deadline"
                        type="date"
                    >

                </div>


                <!-- NOTE -->

                <div class="field">

                    <label>
                        Keterangan
                    </label>

                    <input
                        id="note"
                        type="text"
                        placeholder="Opsional"
                    >

                </div>

            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    class="btn secondary"
                    onclick="closeTaskDialog()"
                >
                    Batal
                </button>


                <button
                    type="submit"
                    class="btn primary"
                >
                    Simpan
                </button>

            </div>

        </form>

    </div>

</dialog>


<!-- =======================================================
     MODAL TAMBAH ORANG
======================================================= -->

<dialog id="personDialog">

    <div class="modal">

        <h2>
            Tambah Orang
        </h2>


        <form
            onsubmit="addPerson(event)"
        >

            <div class="field">

                <label>
                    Nama
                </label>

                <input
                    id="personName"
                    type="text"
                    required
                    placeholder="Contoh: Andi"
                    autocomplete="off"
                >

            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    class="btn secondary"
                    onclick="closePersonDialog()"
                >
                    Batal
                </button>


                <button
                    type="submit"
                    class="btn success"
                >
                    Tambah
                </button>

            </div>

        </form>

    </div>

</dialog>


<!-- =======================================================
     MODAL KELOLA ORANG
======================================================= -->

<dialog id="peopleManagerDialog">

    <div class="modal">

        <h2>
            Kelola Orang
        </h2>


        <div
            id="peopleList"
            class="people-list"
        ></div>


        <div class="modal-actions">

            <button
                type="button"
                class="btn secondary"
                onclick="closePeopleManager()"
            >
                Tutup
            </button>

        </div>

    </div>

</dialog>



<script>

/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
    "https://zwgstnuevycnyzgcggxy.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_W1-empf5i4JK4T4v7DNwmA_BV9RXUs7";


/* =========================================================
   VARIABLES
========================================================= */

let supabaseClient = null;

let people = [];

let tasks = [];

let selectedPIC = "ALL";


/* =========================================================
   INIT
========================================================= */

async function init(){

    supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    await loadPeople();

    await loadTasks();

}


/* =========================================================
   ESCAPE
========================================================= */

function esc(value){

    return String(value ?? "")
        .replace(
            /[&<>"']/g,
            function(m){

                return {

                    "&":"&amp;",
                    "<":"&lt;",
                    ">":"&gt;",
                    '"':"&quot;",
                    "'":"&#039;"

                }[m];

            }
        );

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(value){

    if(!value){

        return "-";

    }


    const parts =
        value.split("-");


    if(parts.length !== 3){

        return value;

    }


    return `
        ${parts[2]}/${parts[1]}/${parts[0]}
    `;

}


/* =========================================================
   LOAD PEOPLE
========================================================= */

async function loadPeople(){

    const {
        data,
        error
    } =
        await supabaseClient
            .from("people")
            .select("*")
            .order(
                "name",
                {
                    ascending:true
                }
            );


    if(error){

        document.getElementById(
            "statusbar"
        ).innerHTML =

            '<span class="error">'
            + 'Gagal membaca data orang:'
            + '</span> '
            + esc(error.message);

        return;

    }


    people = data || [];


    renderNav();

    fillPICSelect();

}


/* =========================================================
   LOAD TASKS
========================================================= */

async function loadTasks(){

    const {
        data,
        error
    } =
        await supabaseClient
            .from("tasks")
            .select("*")
            .order(
                "deadline",
                {
                    ascending:true,
                    nullsFirst:false
                }
            );


    if(error){

        document.getElementById(
            "statusbar"
        ).innerHTML =

            '<span class="error">'
            + 'Gagal membaca task:'
            + '</span> '
            + esc(error.message);

        return;

    }


    tasks = data || [];


    document.getElementById(
        "statusbar"
    ).textContent =

        `Terhubung ke Supabase • `
        + `${tasks.length} task • `
        + `${people.length} orang`;


    render();

}


/* =========================================================
   NAVIGATION
========================================================= */

function renderNav(){

    const nav =
        document.getElementById("nav");


    let html = "";


    /* OVERALL */

    html += `

        <button
            class="${selectedPIC === "ALL" ? "active" : ""}"
            onclick="selectPIC('ALL')"
        >
            Overall
        </button>

    `;


    /* PEOPLE */

    people.forEach(person => {

        html += `

            <button
                class="${selectedPIC === person.name ? "active" : ""}"
                onclick="selectPIC(${JSON.stringify(person.name)})"
            >
                ${esc(person.name)}
            </button>

        `;

    });


    /* ADD PERSON */

    html += `

        <button
            class="add-person"
            onclick="openPersonDialog()"
        >
            + Orang
        </button>

    `;


    /* MANAGE */

    html += `

        <button
            class="manage-person"
            onclick="openPeopleManager()"
        >
            ⚙ Kelola
        </button>

    `;


    nav.innerHTML = html;

}


/* =========================================================
   SELECT PERSON
========================================================= */

function selectPIC(pic){

    selectedPIC = pic;

    renderNav();

    render();

}


/* =========================================================
   FILTER
========================================================= */

function filteredTasks(){

    const search =
        document.getElementById("search");


    const query =
        search
            ? search.value.trim().toLowerCase()
            : "";


    let list =
        tasks.filter(task => {

            if(
                selectedPIC !== "ALL" &&
                task.pic !== selectedPIC
            ){

                return false;

            }


            return true;

        });


    if(query){

        list =
            list.filter(task => {

                return [

                    task.pic,
                    task.task,
                    task.note,
                    task.status,
                    task.deadline

                ]
                .join(" ")
                .toLowerCase()
                .includes(query);

            });

    }


    const sort =
        document.getElementById("sort")
            ?.value || "deadline";


    list.sort((a,b) => {

        if(sort === "newest"){

            return new Date(b.created_at)
                -
                new Date(a.created_at);

        }


        if(sort === "oldest"){

            return new Date(a.created_at)
                -
                new Date(b.created_at);

        }


        const ad =
            a.deadline || "9999-12-31";


        const bd =
            b.deadline || "9999-12-31";


        return ad.localeCompare(bd);

    });


    return list;

}


/* =========================================================
   MAIN RENDER
========================================================= */

function render(){

    const app =
        document.getElementById("app");


    if(selectedPIC === "ALL"){

        app.innerHTML =
            renderOverall();

    }else{

        app.innerHTML =
            renderPersonView(
                selectedPIC
            );

    }

}


/* =========================================================
   OVERALL
========================================================= */

function renderOverall(){

    const list =
        filteredTasks();


    const outstanding =
        list.filter(
            task =>
                task.status !== "Selesai"
        );


    const completed =
        list.filter(
            task =>
                task.status === "Selesai"
        );


    return `

        ${renderOverallTable(
            "OUTSTANDING LIST",
            outstanding,
            false
        )}


        ${renderOverallTable(
            "SELESAI",
            completed,
            true
        )}

    `;

}


/* =========================================================
   OVERALL TABLE
========================================================= */

function renderOverallTable(
    title,
    list,
    isDone
){

    if(!people.length){

        return `

            <div class="overall-section">

                <div class="overall-heading">

                    <div
                        class="overall-heading-title
                        ${isDone ? "done" : "running"}"
                    >

                        ${title}

                    </div>

                </div>


                <div class="overall-wrapper">

                    <div class="empty">

                        Belum ada orang.

                        <br><br>

                        Klik
                        <b>+ Orang</b>
                        untuk menambahkan PIC.

                    </div>

                </div>

            </div>

        `;

    }


    /* =====================================================
       GROUP TASK BY PERSON
    ===================================================== */

    const grouped = {};


    people.forEach(person => {

        grouped[person.name] = [];

    });


    list.forEach(task => {

        if(!grouped[task.pic]){

            grouped[task.pic] = [];

        }


        grouped[task.pic].push(task);

    });


    /* =====================================================
       MAX ROW
    ===================================================== */

    let maxRows = 0;


    people.forEach(person => {

        const count =
            grouped[person.name]?.length || 0;


        if(count > maxRows){

            maxRows = count;

        }

    });


    if(maxRows === 0){

        maxRows = 1;

    }


    /* =====================================================
       HEADER
    ===================================================== */

    let html = `

        <div class="overall-section">

            <div class="overall-heading">

                <div
                    class="
                        overall-heading-title
                        ${isDone ? "done" : "running"}
                    "
                >

                    ${title}

                </div>


                <div class="overall-count">

                    ${list.length} task

                </div>

            </div>


            <div class="overall-wrapper">

                <table class="overall-table">

                    <thead>

                        <tr>

    `;


    people.forEach(person => {

        html += `

            <th>

                <button
                    class="person-header-button"
                    onclick="selectPIC(${JSON.stringify(person.name)})"
                    title="Lihat task ${esc(person.name)}"
                >

                    ${esc(person.name)}

                </button>

            </th>

        `;

    });


    html += `

                        </tr>

                    </thead>


                    <tbody>

    `;


    /* =====================================================
       ROWS
    ===================================================== */

    for(
        let row = 0;
        row < maxRows;
        row++
    ){

        html += "<tr>";


        people.forEach(person => {

            const personTasks =
                grouped[person.name] || [];


            const task =
                personTasks[row];


            if(task){

                let cellClass =
                    "belum-cell";


                if(task.status === "Proses"){

                    cellClass =
                        "proses-cell";

                }


                if(task.status === "Selesai"){

                    cellClass =
                        "done-cell";

                }


                html += `

                    <td>

                        <div
                            class="
                                task-cell
                                ${cellClass}
                            "
                        >

                            <div class="task-text">

                                ${esc(task.task)}

                            </div>


                            ${
                                task.deadline
                                ?
                                `

                                <div
                                    class="task-deadline"
                                >

                                    Deadline:
                                    ${formatDate(task.deadline)}

                                </div>

                                `
                                :
                                ""
                            }


                            ${
                                task.status === "Proses"
                                ?
                                `

                                <span
                                    class="
                                        task-status-small
                                        proses
                                    "
                                >
                                    Proses
                                </span>

                                `
                                :
                                ""
                            }


                            ${
                                task.status === "Selesai"
                                ?
                                `

                                <span
                                    class="
                                        task-status-small
                                        selesai
                                    "
                                >
                                    ✓ Selesai
                                </span>

                                `
                                :
                                ""
                            }


                            <div
                                class="task-actions"
                            >


                                <!-- EDIT -->

                                <button
                                    onclick="openEdit('${task.id}')"
                                >
                                    Edit
                                </button>


                                <!-- STATUS -->

                                ${
                                    task.status === "Selesai"

                                    ?

                                    `

                                    <button
                                        onclick="quickStatus('${task.id}','Proses')"
                                    >
                                        Buka
                                    </button>

                                    `

                                    :

                                    `

                                    <button
                                        class="finish-btn"
                                        onclick="quickStatus('${task.id}','Selesai')"
                                    >
                                        ✓
                                    </button>

                                    `
                                }


                                <!-- DELETE -->

                                <button
                                    onclick="deleteTask('${task.id}')"
                                >
                                    ×
                                </button>


                            </div>

                        </div>

                    </td>

                `;

            }else{

                html += `

                    <td>

                        <div
                            class="empty-cell"
                        ></div>

                    </td>

                `;

            }

        });


        html += "</tr>";

    }


    html += `

                    </tbody>

                </table>

            </div>

        </div>

    `;


    return html;

}


/* =========================================================
   PERSON VIEW
========================================================= */

function renderPersonView(name){

    const list =
        filteredTasks().filter(
            task =>
                task.pic === name
        );


    const running =
        list.filter(
            task =>
                task.status !== "Selesai"
        );


    const done =
        list.filter(
            task =>
                task.status === "Selesai"
        );


    return `

        <div class="person-view">


            <div class="person-title">

                ${esc(name)}

                <span class="muted">

                    • ${list.length} task

                </span>

            </div>


            <!-- RUNNING -->

            <div
                class="
                    person-section-title
                    running
                "
            >

                OUTSTANDING

                <span class="muted">
                    (${running.length})
                </span>

            </div>


            ${
                renderPersonTable(
                    running,
                    false
                )
            }


            <!-- DONE -->

            <div
                class="
                    person-section-title
                    done
                "
            >

                SELESAI

                <span class="muted">
                    (${done.length})
                </span>

            </div>


            ${
                renderPersonTable(
                    done,
                    true
                )
            }


        </div>

    `;

}


/* =========================================================
   PERSON TABLE
========================================================= */

function renderPersonTable(
    list,
    isDone
){

    if(!list.length){

        return `

            <div class="empty">

                Tidak ada task.

            </div>

        `;

    }


    let html = `

        <table class="person-table">

            <thead>

                <tr>

                    <th>Task</th>

                    <th>Deadline</th>

                    <th>Status</th>

                    <th>Keterangan</th>

                    <th>Aksi</th>

                </tr>

            </thead>


            <tbody>

    `;


    html +=
        list.map(task => {

            return `

                <tr>


                    <td>

                        <div class="task-name">

                            ${esc(task.task)}

                        </div>

                    </td>


                    <td>

                        ${formatDate(
                            task.deadline
                        )}

                    </td>


                    <td>

                        ${statusBadge(
                            task.status
                        )}

                    </td>


                    <td class="muted">

                        ${esc(
                            task.note || "-"
                        )}

                    </td>


                    <td>

                        <div class="actions">


                            <button
                                onclick="openEdit('${task.id}')"
                            >
                                Edit
                            </button>


                            ${
                                task.status === "Selesai"

                                ?

                                `

                                <button
                                    onclick="quickStatus('${task.id}','Proses')"
                                >
                                    Buka
                                </button>

                                `

                                :

                                `

                                <button
                                    onclick="quickStatus('${task.id}','Selesai')"
                                >
                                    Selesai
                                </button>

                                `
                            }


                            <button
                                onclick="deleteTask('${task.id}')"
                            >
                                Hapus
                            </button>


                        </div>

                    </td>


                </tr>

            `;

        }).join("");


    html += `

            </tbody>

        </table>

    `;


    return html;

}


/* =========================================================
   STATUS BADGE
========================================================= */

function statusBadge(status){

    let className =
        "belum";


    if(status === "Proses"){

        className =
            "proses";

    }


    if(status === "Selesai"){

        className =
            "selesai";

    }


    return `

        <span
            class="badge ${className}"
        >

            ${esc(status)}

        </span>

    `;

}


/* =========================================================
   PIC SELECT
========================================================= */

function fillPICSelect(){

    const select =
        document.getElementById("pic");


    if(!select){

        return;

    }


    select.innerHTML =
        people.map(person => {

            return `

                <option
                    value="${esc(person.name)}"
                >

                    ${esc(person.name)}

                </option>

            `;

        }).join("");

}


/* =========================================================
   ADD TASK
========================================================= */

function openAdd(){

    if(!people.length){

        alert(
            "Tambahkan orang terlebih dahulu."
        );

        return;

    }


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Tambah Task";


    document.getElementById(
        "taskId"
    ).value = "";


    document.getElementById(
        "taskForm"
    ).reset();


    fillPICSelect();


    const picSelect =
        document.getElementById("pic");


    if(
        selectedPIC !== "ALL" &&
        people.some(
            person =>
                person.name === selectedPIC
        )
    ){

        picSelect.value =
            selectedPIC;

    }


    document.getElementById(
        "taskStatus"
    ).value =
        "Belum";


    document.getElementById(
        "taskDialog"
    ).showModal();

}


/* =========================================================
   EDIT TASK
========================================================= */

function openEdit(id){

    const task =
        tasks.find(
            item =>
                String(item.id)
                ===
                String(id)
        );


    if(!task){

        return;

    }


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Edit Task";


    document.getElementById(
        "taskId"
    ).value =
        task.id;


    fillPICSelect();


    document.getElementById(
        "pic"
    ).value =
        task.pic;


    document.getElementById(
        "task"
    ).value =
        task.task;


    document.getElementById(
        "taskStatus"
    ).value =
        task.status;


    document.getElementById(
        "deadline"
    ).value =
        task.deadline || "";


    document.getElementById(
        "note"
    ).value =
        task.note || "";


    document.getElementById(
        "taskDialog"
    ).showModal();

}


/* =========================================================
   SAVE TASK
========================================================= */

async function saveTask(event){

    event.preventDefault();


    const id =
        document.getElementById(
            "taskId"
        ).value;


    const payload = {

        pic:
            document.getElementById(
                "pic"
            ).value,

        task:
            document.getElementById(
                "task"
            ).value.trim(),

        status:
            document.getElementById(
                "taskStatus"
            ).value,

        deadline:
            document.getElementById(
                "deadline"
            ).value
            ||
            null,

        note:
            document.getElementById(
                "note"
            ).value.trim()
            ||
            null

    };


    let result;


    if(id){

        result =
            await supabaseClient
                .from("tasks")
                .update(payload)
                .eq("id",id);

    }else{

        result =
            await supabaseClient
                .from("tasks")
                .insert(payload);

    }


    if(result.error){

        alert(
            "Gagal menyimpan task:\n\n"
            +
            result.error.message
        );

        return;

    }


    closeTaskDialog();


    await loadTasks();

}


/* =========================================================
   QUICK STATUS
========================================================= */

async function quickStatus(
    id,
    status
){

    const {
        error
    } =
        await supabaseClient
            .from("tasks")
            .update({
                status:status
            })
            .eq("id",id);


    if(error){

        alert(
            "Gagal mengubah status:\n\n"
            +
            error.message
        );

        return;

    }


    await loadTasks();

}


/* =========================================================
   DELETE TASK
========================================================= */

async function deleteTask(id){

    const task =
        tasks.find(
            item =>
                String(item.id)
                ===
                String(id)
        );


    if(!task){

        return;

    }


    const confirmed =
        confirm(
            `Hapus task berikut?\n\n${task.task}`
        );


    if(!confirmed){

        return;

    }


    const {
        error
    } =
        await supabaseClient
            .from("tasks")
            .delete()
            .eq("id",id);


    if(error){

        alert(
            "Gagal menghapus task:\n\n"
            +
            error.message
        );

        return;

    }


    await loadTasks();

}


/* =========================================================
   ADD PERSON
========================================================= */

function openPersonDialog(){

    document.getElementById(
        "personName"
    ).value = "";


    document.getElementById(
        "personDialog"
    ).showModal();


    setTimeout(
        () => {

            document.getElementById(
                "personName"
            ).focus();

        },
        100
    );

}


function closePersonDialog(){

    document.getElementById(
        "personDialog"
    ).close();

}


/* =========================================================
   SAVE PERSON
========================================================= */

async function addPerson(event){

    event.preventDefault();


    const input =
        document.getElementById(
            "personName"
        );


    const name =
        input.value.trim();


    if(!name){

        return;

    }


    const exists =
        people.some(
            person =>
                person.name.toLowerCase()
                ===
                name.toLowerCase()
        );


    if(exists){

        alert(
            "Nama tersebut sudah ada."
        );

        return;

    }


    const {
        error
    } =
        await supabaseClient
            .from("people")
            .insert({
                name:name
            });


    if(error){

        alert(
            "Gagal menambahkan orang:\n\n"
            +
            error.message
        );

        return;

    }


    closePersonDialog();


    await loadPeople();


    selectedPIC =
        name;


    renderNav();

    render();


    document.getElementById(
        "statusbar"
    ).textContent =

        `Terhubung ke Supabase • `
        +
        `${tasks.length} task • `
        +
        `${people.length} orang`;

}


/* =========================================================
   PEOPLE MANAGER
========================================================= */

function openPeopleManager(){

    renderPeopleManager();


    document.getElementById(
        "peopleManagerDialog"
    ).showModal();

}


function closePeopleManager(){

    document.getElementById(
        "peopleManagerDialog"
    ).close();

}


/* =========================================================
   RENDER PEOPLE MANAGER
========================================================= */

function renderPeopleManager(){

    const container =
        document.getElementById(
            "peopleList"
        );


    if(!people.length){

        container.innerHTML = `

            <div class="empty">

                Belum ada orang.

            </div>

        `;

        return;

    }


    container.innerHTML =
        people.map(person => {

            const taskCount =
                tasks.filter(
                    task =>
                        task.pic
                        ===
                        person.name
                ).length;


            return `

                <div class="people-item">


                    <div>

                        <div
                            class="people-item-name"
                        >

                            ${esc(
                                person.name
                            )}

                        </div>


                        <div class="muted">

                            ${taskCount}
                            task

                        </div>

                    </div>


                    <button
                        class="btn danger"
                        onclick="deletePerson('${person.id}')"
                    >
                        Hapus
                    </button>


                </div>

            `;

        }).join("");

}


/* =========================================================
   DELETE PERSON
========================================================= */

async function deletePerson(id){

    const person =
        people.find(
            item =>
                String(item.id)
                ===
                String(id)
        );


    if(!person){

        return;

    }


    const taskCount =
        tasks.filter(
            task =>
                task.pic
                ===
                person.name
        ).length;


    if(taskCount > 0){

        alert(

            `Tidak bisa menghapus ${person.name}.\n\n`
            +
            `Masih ada ${taskCount} task `
            +
            `yang menggunakan PIC tersebut.\n\n`
            +
            `Selesaikan atau pindahkan task `
            +
            `terlebih dahulu.`

        );

        return;

    }


    const confirmed =
        confirm(
            `Hapus orang "${person.name}"?`
        );


    if(!confirmed){

        return;

    }


    const {
        error
    } =
        await supabaseClient
            .from("people")
            .delete()
            .eq("id",id);


    if(error){

        alert(
            "Gagal menghapus orang:\n\n"
            +
            error.message
        );

        return;

    }


    if(
        selectedPIC
        ===
        person.name
    ){

        selectedPIC =
            "ALL";

    }


    await loadPeople();


    renderPeopleManager();

    render();

}


/* =========================================================
   CLOSE TASK
========================================================= */

function closeTaskDialog(){

    document.getElementById(
        "taskDialog"
    ).close();

}


/* =========================================================
   START APPLICATION
========================================================= */

init();

</script>
